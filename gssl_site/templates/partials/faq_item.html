<div class="accordion__item"><h3><button class="accordion__trigger" type="button" aria-expanded="{% if item.is_open %}true{% else %}false{% endif %}" aria-controls="faq-{{ item.number }}" id="faq-b-{{ item.number }}">{{ item.question }}<span class="accordion__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12.01 4.8C12.1 9.47 12.07 14.13 11.93 19.12M4.87 11.95C9.54 12.16 14.2 12.08 19.17 11.99"/></svg></span></button></h3><div class="accordion__panel{% if item.is_open %} is-open{% endif %}" id="faq-{{ item.number }}" role="region" aria-labelledby="faq-b-{{ item.number }}"><div><p class="accordion__content">{{ item.answer_html }}</p></div></div></div>
