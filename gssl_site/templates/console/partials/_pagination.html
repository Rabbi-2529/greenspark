{% if page_obj.has_other_pages %}
  <nav class="cns-pages" aria-label="Pages">
    {% if page_obj.has_previous %}
      <a class="cns-pages__step" href="?{% if carried %}{{ carried }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>
    {% else %}
      <span class="cns-pages__step is-off">Previous</span>
    {% endif %}

    <span class="cns-pages__count">
      Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
      <span class="cns-muted">· {{ page_obj.paginator.count }} in total</span>
    </span>

    {% if page_obj.has_next %}
      <a class="cns-pages__step" href="?{% if carried %}{{ carried }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next</a>
    {% else %}
      <span class="cns-pages__step is-off">Next</span>
    {% endif %}
  </nav>
{% endif %}
