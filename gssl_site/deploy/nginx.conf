# nginx site for the GSSL website. Replace greensparksolutions.com with the
# live domain and point the certificate paths at your certificates (certbot:
# sudo certbot --nginx -d greensparksolutions.com -d www.greensparksolutions.com).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gssl
#   sudo ln -s /etc/nginx/sites-available/gssl /etc/nginx/sites-enabled/gssl
#   sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP: the ACME challenge, then redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name greensparksolutions.com www.greensparksolutions.com;

    # Let's Encrypt answers its HTTP-01 challenge on port 80, so this has to
    # be served rather than redirected. The redirect sits inside location /
    # and not at server level on purpose: a server-level `return` runs in the
    # rewrite phase, before nginx matches any location, so it would send the
    # challenge away with a 301 and certbot would fail with no obvious cause.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://greensparksolutions.com$request_uri;
    }
}

# www -> bare domain, so every page has one address.
server {
    # http2 as a listen parameter, not the separate `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, where that directive does not exist yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.greensparksolutions.com;
    ssl_certificate     /etc/letsencrypt/live/greensparksolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greensparksolutions.com/privkey.pem;
    return 301 https://greensparksolutions.com$request_uri;
}

server {
    # http2 as a listen parameter, not the separate `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, where that directive does not exist yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greensparksolutions.com;

    ssl_certificate     /etc/letsencrypt/live/greensparksolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greensparksolutions.com/privkey.pem;

    # The contact form, and a photograph uploaded through the console. Django
    # refuses an image over DJANGO_UPLOAD_MAX_BYTES (10 MB by default) with a
    # message naming the limit; this is a little above that, so the person
    # sees that message rather than nginx's bare 413.
    client_max_body_size 12m;

    # Static files straight from disk. Every URL the templates emit carries a
    # content hash, so browsers may keep it for a year. WhiteNoise has already
    # written .gz and .br copies next to each file.
    location /static/ {
        alias /srv/gssl/static/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Photographs uploaded through the console. Not hashed and not in git, so
    # this is the one directory on the server with content in it that no
    # deploy recreates -- see "Backups" in deploy/RUNBOOK.md. Without this
    # block an upload saves successfully and then 404s, because / below would
    # hand /media/... to Django, which does not serve media with DEBUG off.
    location /media/ {
        alias /srv/gssl/media/;
        # A missing file answers 404 here rather than falling through to
        # Django, which would render the site's 404 page for an image.
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        # Uploads are somebody else's bytes: never let a browser guess that
        # one of them is a document.
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'; sandbox";
        access_log off;
    }

    # Everything else goes to Django, which sets the security headers.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
