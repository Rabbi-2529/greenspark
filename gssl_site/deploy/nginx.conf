# nginx site for the GSSL website. Replace greensparksolutions.com with the
# live domain and point the certificate paths at your certificates (certbot:
# sudo certbot --nginx -d greensparksolutions.com -d www.greensparksolutions.com).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gssl
#   sudo ln -s /etc/nginx/sites-available/gssl /etc/nginx/sites-enabled/gssl
#   sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name greensparksolutions.com www.greensparksolutions.com;
    return 301 https://greensparksolutions.com$request_uri;
}

# www -> bare domain, so every page has one address.
server {
    # http2 as a listen parameter, not the separate `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, where that directive does not exist yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.greensparksolutions.com;
    ssl_certificate     /etc/letsencrypt/live/greensparksolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greensparksolutions.com/privkey.pem;
    return 301 https://greensparksolutions.com$request_uri;
}

server {
    # http2 as a listen parameter, not the separate `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, where that directive does not exist yet.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greensparksolutions.com;

    ssl_certificate     /etc/letsencrypt/live/greensparksolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greensparksolutions.com/privkey.pem;

    # The only upload is the contact form.
    client_max_body_size 1m;

    # Static files straight from disk. Every URL the templates emit carries a
    # content hash, so browsers may keep it for a year. WhiteNoise has already
    # written .gz and .br copies next to each file.
    location /static/ {
        alias /srv/gssl/static/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Everything else goes to Django, which sets the security headers.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
